<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suvdaa | Profile</title>
    <style>
        /* 기본 스타일 및 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }

        /* 상단 소개 영역 (Hero Section) */
        header {
            background-color: #1a2a6c; /* 깊은 남색 */
            color: white;
            padding: 80px 20px;
            text-align: center;
        }

        .hero-emoji {
            font-size: 4rem;
            margin-bottom: 20px;
            display: inline-block;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 본문 영역 (Content Section) */
        main {
            max-width: 800px;
            margin: -40px auto 60px; /* 상단 영역과 살짝 겹치게 디자인 */
            padding: 40px 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #1a2a6c;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .section-title span {
            margin-right: 10px;
        }

        /* 리스트 스타일 */
        .info-list {
            list-style: none;
        }

        .info-list li {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }

        .info-list li::before {
            content: "•";
            color: #1a2a6c;
            font-weight: bold;
            display: inline-block; 
            width: 1em;
            margin-left: 0;
        }

        /* 카드 스타일 (좋아하는 것) */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .card {
            background: #f0f4f8;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 10px;
        }

        /* 목표 문구 */
        .goal-box {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 500;
            font-style: italic;
        }

        /* 반응형 조절 (스마트폰 대응) */
        @media (max-width: 600px) {
            header {
                padding: 60px 20px;
            }
            header h1 {
                font-size: 2rem;
            }
            main {
                margin-top: -20px;
                padding: 30px 15px;
            }
            .section-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="hero-emoji">✨</div>
        <h1>Suvdaa</h1>
        <p>경영학과 3학년 | 유통 · 마케팅 · 창업</p>
    </header>

    <main>
        <!-- 관심 분야 -->
        <div class="section">
            <h2 class="section-title"><span>🔍</span> 관심 분야</h2>
            <ul class="info-list">
                <li>데이터 기반 유통 전략 분석</li>
                <li>브랜드 마케팅 및 콘텐츠 기획</li>
                <li>혁신적인 비즈니스 모델 창업</li>
            </ul>
        </div>

        <!-- 좋아하는 것 3가지 -->
        <div class="section">
            <h2 class="section-title"><span>❤️</span> 좋아하는 것</h2>
            <div class="card-container">
                <div class="card">
                    <span class="card-emoji">☕</span>
                    <span>따뜻한 커피</span>
                </div>
                <div class="card">
                    <span class="card-emoji">📚</span>
                    <span>경제 서적 읽기</span>
                </div>
                <div class="card">
                    <span class="card-emoji">✈️</span>
                    <span>새로운 여행지</span>
                </div>
            </div>
        </div>

        <!-- 목표 -->
        <div class="section">
            <h2 class="section-title"><span>🚀</span> 나의 목표</h2>
            <div class="goal-box">
                "세상의 흐름을 읽고 가치를 전달하는 비즈니스 전문가가 되는 것"
            </div>
        </div>
    </main>

</body>
</html>
